[platformio]
default_envs = esp32s3
[env:esp32s3]                          ; আসল Data Logger
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; bench/ বাদ, কিন্তু কার্নেলটা চাই।
build_src_filter = +<*> -<bench/> +<bench/lif_snn.c>

; inference.cpp থাকে src/-এ, হেডারগুলো src/bench/-এ — তাই include path লাগবে।
build_flags =
    -Isrc/bench
    -DSNN_MODEL_HEADER=\"soiling_snn.h\"
    -DSNN_GOLDEN_HEADER=\"soiling_golden.h\"

lib_deps =
    adafruit/Adafruit INA219 @ ^1.2.3
    claws/BH1750 @ ^1.3.0
    paulstoffregen/OneWire @ ^2.3.7
    milesburton/DallasTemperature @ ^3.11.0
    greiman/SdFat

; ---- add to platformio.ini ----------------------------------------------
; One kernel, two models. The model is chosen entirely by build flags, so
; there is no #ifdef in the C and no second copy of lif_snn.c to keep in sync.

[env:bench]                      ; soiling SNN (769 params) + ANN baseline
extends = env:esp32s3
build_src_filter = +<bench/> -<main.cpp> -<logger.cpp> -<sensors.cpp>
build_flags =
    -DSNN_MODEL_HEADER=\"soiling_snn.h\"
    -DSNN_GOLDEN_HEADER=\"soiling_golden.h\"
    -DHAVE_MLP

[env:bench_fc]                   ; forecasting SNN (4867 params, 7-64-64-3) + GRU baseline
extends = env:esp32s3
build_src_filter = +<bench/> -<main.cpp> -<logger.cpp> -<sensors.cpp>
build_flags =
    -DSNN_MODEL_HEADER=\"forecast_snn.h\"
    -DSNN_GOLDEN_HEADER=\"forecast_golden.h\"
    -DHAVE_GRU

; pio run -e bench     -t upload      -> soiling benchmark
; pio run -e bench_fc  -t upload      -> forecasting benchmark